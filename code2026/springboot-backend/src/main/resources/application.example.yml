# ============================================================
# Spring Boot 后端配置文件模板（Web管理后台 + 用户前台）
# 使用方式：复制本文件为 application.yml，填入真实配置值
# ============================================================

server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: <your-db-username>
    password: <your-db-password>
    url: jdbc:mysql://localhost:3306/code2026?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

minio:
  endpoint: http://127.0.0.1:9000
  access-key: <your-minio-access-key>
  secret-key: <your-minio-secret-key>
  bucket-name: code2026

deepseek:
  api-key: <your-deepseek-api-key>
  base-url: https://api.deepseek.com

fileBaseUrl: http://localhost
